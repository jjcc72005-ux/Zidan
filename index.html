<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zidan - مشاركة الملفات</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-share-alt"></i> Zidan</h1>
            <p>شارك الملفات بسهولة على نفس الشبكة</p>
        </header>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <i class="fas fa-cloud-upload-alt"></i>
                <h3>اسحب الملفات هنا أو انقر للاختيار</h3>
                <p>الحد الأقصى للملف: 100MB</p>
                <input type="file" id="fileInput" multiple style="display: none;">
            </div>
        </div>

        <div class="devices-section">
            <h2><i class="fas fa-laptop"></i> الأجهزة المتصلة</h2>
            <div class="devices-grid" id="devicesGrid">
                <div class="loading">جاري البحث عن الأجهزة...</div>
            </div>
        </div>

        <div class="transfer-section" id="transferSection" style="display: none;">
            <h2><i class="fas fa-exchange-alt"></i> عمليات النقل</h2>
            <div class="transfers-list" id="transfersList"></div>
        </div>
    </div>

    <!-- نافذة طلب الإذن -->
    <div class="modal" id="permissionModal">
        <div class="modal-content">
            <h3><i class="fas fa-user-check"></i> طلب إذن</h3>
            <p id="permissionText">يريد إرسال ملف لك</p>
            <div class="modal-actions">
                <button class="btn btn-accept" id="acceptBtn">قبول</button>
                <button class="btn btn-reject" id="rejectBtn">رفض</button>
            </div>
        </div>
    </div>

    <!-- نافذة اختيار الجهاز -->
    <div class="modal" id="deviceModal">
        <div class="modal-content">
            <h3><i class="fas fa-mobile-alt"></i> اختر نوع جهازك</h3>
            <div class="device-options">
                <div class="device-option" data-type="phone">
                    <i class="fas fa-mobile-alt"></i>
                    <span>هاتف</span>
                </div>
                <div class="device-option" data-type="tablet">
                    <i class="fas fa-tablet-alt"></i>
                    <span>تابلت</span>
                </div>
                <div class="device-option" data-type="laptop">
                    <i class="fas fa-laptop"></i>
                    <span>كمبيوتر</span>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
